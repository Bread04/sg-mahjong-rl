[project]
name = "sgmj"
version = "0.1.0"
description = "Singapore Mahjong reinforcement learning: fast environment, self-play agent, rigorous evaluation."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Braedon Lim" }]
license = { text = "MIT" }
dependencies = [
    "numpy>=2.0",
]

[project.optional-dependencies]
# Heavy training stack. Install with: uv sync --extra rl
rl = [
    "torch>=2.7",
    "gymnasium>=1.0",
    "pettingzoo>=1.24",
    "tensorboard>=2.17",
    "hydra-core>=1.3",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

# CUDA build of torch for the RTX 4070 SUPER (Windows/Linux). CI never installs the rl extra.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sgmj"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "slow: long-running tests (deselect with -m 'not slow')",
    "exercise: Phase 0 exercises you implement yourself (skipped until implemented)",
]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
